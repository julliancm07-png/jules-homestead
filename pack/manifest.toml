# Jules' Homestead — human-edited mod manifest.
# tools/resolve.py turns this into pack/mods.lock.json (exact version IDs, hashes, deps, sides, licenses).
# Fields: slug (Modrinth slug) | source ("modrinth" default, "ftb-maven", "local") | version (exact version_number pin; omit → newest
# release for the target, recorded in the lockfile) | side override ("client"/"server"/"both") | optional (mrpack env optional)
# | group | purpose.

[pack]
name = "Jules' Homestead"
version = "1.0.0"
minecraft = "26.1.2"
loader = "fabric"
loader_version = "0.20.1"
summary = "A grounded homestead-to-town survival pack: seasons, storms and blizzards, renewable power for real appliances, residents and a hand-written quest book."

# ---------------------------------------------------------------- core & performance
[[mod]]
slug = "fabric-api"
group = "core"
purpose = "Fabric API."
[[mod]]
slug = "sodium"
group = "performance"
purpose = "Renderer (client baseline)."
[[mod]]
slug = "sodium-extra"
group = "performance"
purpose = "Extra Sodium video options (fog, particles, animations)."
[[mod]]
slug = "reeses-sodium-options"
group = "performance"
purpose = "Readable tabbed video settings."
[[mod]]
slug = "lithium"
group = "performance"
purpose = "Server/tick optimisation."
[[mod]]
slug = "ferrite-core"
group = "performance"
purpose = "Memory reduction."
[[mod]]
slug = "immediatelyfast"
group = "performance"
purpose = "Immediate-mode rendering speedups (HUD, text, entities)."
[[mod]]
slug = "entityculling"
group = "performance"
purpose = "Skip rendering hidden (block-)entities — important with furnished houses."
[[mod]]
slug = "moreculling"
group = "performance"
purpose = "Extra block culling (leaves etc.)."
[[mod]]
slug = "dynamic-fps"
group = "performance"
purpose = "Throttle FPS when unfocused/idle."
[[mod]]
slug = "krypton"
group = "performance"
purpose = "Network stack optimisation."
[[mod]]
slug = "modmenu"
group = "core"
purpose = "In-game mod list and config entry points."
[[mod]]
slug = "iris"
group = "visual-optional"
purpose = "Shader loader. Installed but shaders OFF by default (optional preset)."
[[mod]]
slug = "distanthorizons"
group = "visual-optional"
optional = true
purpose = "Optional long-distance terrain LOD. Off by default (performance cost)."

